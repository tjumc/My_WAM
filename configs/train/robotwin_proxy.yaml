output_dir: ./runs/robotwin/default

# dataloading
batch_size: 12
num_workers: 16

# scheduler
lr_scheduler_type: cosine
learning_rate: 2.0e-4
num_epochs: 5
max_steps: null
log_every: 10
save_every: 5000
eval_every: 2500
eval_num_inference_steps: 10

# training
gradient_accumulation_steps: 1
mixed_precision: bf16
seed: 42
max_grad_norm: 1.0
weight_decay: 1.0e-2
resume: null

